[versions]
android-gradle-plugin = "8.4.2"
kotlin = "2.0.21"
okio-android = "2.2.2"
okio-ios = "3.3.0"
desugar-jdk-libs-nio = "2.0.1"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
okio-android = { module = "com.squareup.okio:okio", version.ref = "okio-android" }
okio-ios = { module = "com.squareup.okio:okio", version.ref = "okio-ios" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar-jdk-libs-nio" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
